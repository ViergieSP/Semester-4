<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Selamat Datang</title>
    <link rel="icon" href="https://media.istockphoto.com/id/1488761029/id/vektor/abstrak-sunrise-sunshine-morning-dawn-burst-ray-sparkle-shine-desain-vektor-warna-warni.jpg?s=1024x1024&w=is&k=20&c=cG8fj9v_EluTJ7RRH6nOymS85ZodrD3TfPoFtUq_HrU=">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="main-container">
        <div class="split-layout">

            <div class="left-side">
                <div class="form-box">
                    <h2>Selamat Datang Kembali</h2>
                    <p class="subtitle">Silakan masukkan detail akun Anda.</p>
                    
                    <form action="index.html" method="get">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="alamat@email.com" required>

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>

                        <button type="submit">Login</button>
                    </form>

                    <p class="footer-text">Belum punya akun? <a href="register.html">Daftar Gratis</a></p>
                </div>
            </div>

            <div class="right-side">
                <h1 class="hero-title">Halo Sobat!</h1>
                <p class="hero-desc">
                    Jelajahi pengalaman baru bersama platform kami yang modern dan cepat.
                </p>
            </div>
        </div>
    </main>
</body>
</html>
