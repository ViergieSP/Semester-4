<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Buat Akun</title>
    <link rel="icon" href="https://media.istockphoto.com/id/1488761029/id/vektor/abstrak-sunrise-sunshine-morning-dawn-burst-ray-sparkle-shine-desain-vektor-warna-warni.jpg?s=1024x1024&w=is&k=20&c=cG8fj9v_EluTJ7RRH6nOymS85ZodrD3TfPoFtUq_HrU=">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <main class="main-container">
        <div class="split-layout">
 
            <div class="left-side">
                <h1 class="hero-title">Gabung Sekarang</h1>
                <p class="hero-desc">
                    Hanya butuh beberapa detik untuk memulai perjalanan Anda.
                </p>
            </div>
    
            <div class="right-side">
                <div class="form-box">
                    <h2>Daftar Akun</h2>
                    <p class="subtitle">Buat akun untuk menikmati semua fitur kami.</p>
                    
                    <form action="login.html" method="get">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="alamat@email.com" required>

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Buat password kuat" required>

                        <button type="submit">Daftar</button>
                    </form>

                    <p class="footer-text">Sudah punya akun? <a href="login.html">Login di sini</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
